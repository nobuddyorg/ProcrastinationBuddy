[project]
name = "procrastinationbuddy-frontend"
version = "0.1.0"
description = "ProcrastinationBuddy Frontend"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "pytz>=2026.2",
    "requests>=2.34.2",
    "ruff>=0.15.20",
    "st-theme>=1.2.3",
    "streamlit>=1.58.0",
    "streamlit-javascript>=0.1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
