[project]
name = "procrastinationbuddy-frontend"
version = "0.1.0"
description = "ProcrastinationBuddy Frontend"
requires-python = ">=3.13"
dependencies = [
    "pytz>=2026.2",
    "requests>=2.34.2",
    "st-theme>=1.2.3",
    "streamlit>=1.60.0",
    "streamlit-javascript>=0.1.5",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
